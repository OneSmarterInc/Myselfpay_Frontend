name: Frontend tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  integration:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 'true'
      FRONTEND_ORIGIN: http://localhost:5173
      PLAYWRIGHT_CHANNEL: chromium
      E2E_FAKE_SMS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OneSmarterInc/MyselfPay_Backend
          # Paired API contract for mobile-only patient accounts.
          ref: acb54b7b14bc07aba516ffd707a2d349925a9c09
          path: .backend
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r .backend/requirements.lock
      - run: python .backend/manage.py migrate --noinput
      - run: python .backend/manage.py seed_demo
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser to Django integration
        run: |
          # The browser suite creates many synthetic sessions from one runner IP.
          # Raise only this test process's guest quota; production defaults and
          # the backend rate-limit regression tests remain unchanged.
          python e2e/backend_server.py > /tmp/selfpay-backend.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail http://127.0.0.1:8000/api/health && break; sleep 1; done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
